# Source Registry declarations (architecture Section 4, 40B step 2).
# Human-owned. Every source must be declared here before its data is used.
# These are declarations only - no data is downloaded yet.
# Excluded source classes (architecture 4F.2) are refused by the code:
#   private_tip_channel, unattributed_rumour, non_public_information

sources:
  - source_id: nse_bhavcopy_equity
    provider: NSE
    source_class: exchange_official
    data_type: daily equity prices (open, high, low, close, volume)
    endpoint: https://www.nseindia.com/all-reports (CM bhavcopy)
    authority: primary
    license: NSE website terms of use - check before redistribution
    update_frequency: daily, after market close
    historical_coverage: to be confirmed at ingestion (Stage 7)
    latency: same evening
    revision_policy: rarely revised; any revision is stored as a new version
    timestamp_semantics: publication_time
    reliability_rating: A
    authentication_method: none (public download)
    schema_description: one row per symbol and series per trading day

  - source_id: nse_corporate_actions
    provider: NSE
    source_class: exchange_official
    data_type: corporate actions (splits, bonuses, dividends, rights)
    endpoint: https://www.nseindia.com/companies-listing/corporate-filings-actions
    authority: primary
    license: NSE website terms of use - check before redistribution
    update_frequency: as announced
    historical_coverage: to be confirmed at ingestion
    latency: same day as announcement
    revision_policy: amendments published as new announcements
    timestamp_semantics: effective_date
    reliability_rating: A
    authentication_method: none (public download)
    schema_description: one row per action with symbol, type, ratio or amount, ex-date

  - source_id: nse_index_constituents
    provider: NSE Indices
    source_class: index_provider
    data_type: index membership (e.g. NIFTY 50, NIFTY 500)
    endpoint: https://www.niftyindices.com
    authority: primary
    license: NSE Indices terms of use - check before redistribution
    update_frequency: on index reconstitution (semi-annual plus ad hoc)
    historical_coverage: current list only; history must be rebuilt from change notices
    latency: announced ahead of effective date
    revision_policy: changes published as reconstitution notices
    timestamp_semantics: effective_date
    reliability_rating: A
    authentication_method: none (public download)
    schema_description: one row per index constituent with effective dates

  - source_id: nse_equity_list
    provider: NSE
    source_class: exchange_official
    data_type: list of securities available for trading in the equity segment (EQUITY_L.csv)
    endpoint: https://www.nseindia.com/market-data/securities-available-for-trading
    authority: primary
    license: NSE website terms of use - check before redistribution
    update_frequency: daily snapshot
    historical_coverage: current snapshot only - no history
    latency: same day
    revision_policy: replaced by NSE every day; each download is kept as its own raw file
    timestamp_semantics: snapshot_no_vintage
    reliability_rating: A
    authentication_method: none (manual browser download)
    schema_description: one row per listed security - symbol, company name, series, listing date, ISIN

  - source_id: nse_financial_results_index
    provider: NSE
    source_class: exchange_official
    data_type: listing of financial-results filings with XBRL links and exchange dissemination times
    endpoint: https://www.nseindia.com/companies-listing/corporate-filings-financial-results
    authority: primary
    license: NSE website terms of use - check before redistribution
    update_frequency: as companies file
    historical_coverage: chosen date range per download
    latency: minutes after filing
    revision_policy: re-filings appear as new rows with their own XBRL file and times
    timestamp_semantics: publication_time
    reliability_rating: A
    authentication_method: none (manual browser download)
    schema_description: one row per filing - company, audited, cumulative, basis, period, XBRL link, received and disseminated times

  - source_id: nse_financial_results_xbrl
    provider: NSE (company filings)
    source_class: company_filing
    data_type: quarterly and annual financial results in XBRL (non-financial Ind AS format)
    endpoint: https://nsearchives.nseindia.com/corporate/xbrl/
    authority: primary
    license: NSE website terms of use - check before redistribution
    update_frequency: quarterly per company
    historical_coverage: per filing
    latency: as filed by the company
    revision_policy: a re-filing is a new file; a changed value is a conflict until a correction is recorded
    timestamp_semantics: publication_time
    reliability_rating: A
    authentication_method: none (manual browser download)
    schema_description: XBRL instance - contexts, units and facts per filing; basis declared in the file

  - source_id: nse_integrated_filing_index
    provider: NSE
    source_class: exchange_official
    data_type: listing of SEBI integrated filings (financials) with XBRL links, submission type and exchange dissemination times
    endpoint: https://www.nseindia.com/companies-listing/corporate-integrated-filing?integratedType=integratedfilingfinancials
    authority: primary
    license: NSE website terms of use - check before redistribution
    update_frequency: as companies file
    historical_coverage: quarters ended March 2025 onwards; chosen company or date range per download
    latency: minutes after filing
    revision_policy: revised filings are marked Revised with a revision time and remarks
    timestamp_semantics: publication_time
    reliability_rating: A
    authentication_method: none (manual browser download)
    schema_description: one row per filing - symbol, company, quarter end, submission type, audited, basis, XBRL link, broadcast, revision and dissemination times

  - source_id: nse_integrated_filing_xbrl
    provider: NSE (company filings)
    source_class: company_filing
    data_type: quarterly and annual results in SEBI integrated-filing XBRL (Ind AS companies and banks)
    endpoint: https://nsearchives.nseindia.com/corporate/xbrl/
    authority: primary
    license: NSE website terms of use - check before redistribution
    update_frequency: quarterly per company
    historical_coverage: per filing, quarters ended March 2025 onwards
    latency: as filed by the company
    revision_policy: a revised filing is a new file; a changed value is a conflict until a correction is recorded
    timestamp_semantics: publication_time
    reliability_rating: A
    authentication_method: none (manual browser download)
    schema_description: XBRL instance in SEBI's in-capmkt taxonomy - symbol, ISIN, basis, contexts, units and facts per filing

  - source_id: nse_announcements
    provider: NSE
    source_class: exchange_official
    data_type: corporate announcements - one row per filing with subject, details, attachment link and exchange receipt and dissemination times
    endpoint: https://www.nseindia.com/companies-listing/corporate-filings-announcements
    authority: primary
    license: NSE website terms of use - check before redistribution
    update_frequency: as companies file
    historical_coverage: chosen company or date range per download
    latency: seconds after filing
    revision_policy: corrections arrive as new filings (for example a corrigendum); nothing is edited in place
    timestamp_semantics: publication_time
    reliability_rating: A
    authentication_method: none (manual browser download)
    schema_description: one row per filing - symbol, company, subject, details, broadcast, receipt and dissemination times, attachment link

  - source_id: gdelt_doc_news
    provider: The GDELT Project
    source_class: licensed_vendor
    data_type: news article metadata - link, headline, site, language, country and the time GDELT first saw each article
    endpoint: https://api.gdeltproject.org/api/v2/doc/doc (DOC 2.0 API, article list, JSON)
    authority: secondary
    license: GDELT open data - unlimited use including commercial; every use must cite the GDELT Project with a link to https://www.gdeltproject.org/ ; article links are never opened (ADR-005)
    update_frequency: every 15 minutes
    historical_coverage: rolling last 3 months through the DOC API
    latency: up to 15 minutes after GDELT sees an article
    revision_policy: an article is recorded once with the headline GDELT saw; nothing is edited
    timestamp_semantics: publication_time
    reliability_rating: B
    authentication_method: none (public API; requests spaced and backed off - ADR-005)
    schema_description: one object per article - url, url_mobile, title, seendate (UTC, 15-minute steps), socialimage, domain, language, sourcecountry

  - source_id: sebi_rss
    provider: SEBI
    source_class: regulator_official
    data_type: SEBI releases - orders, recovery proceedings, circulars and press releases; title, link and date
    endpoint: https://www.sebi.gov.in/sebirss.xml (RSS 2.0)
    authority: primary
    license: SEBI website policy - linking needs no permission; reproduction needs permission by email; stored privately for research and never republished (ADR-006)
    update_frequency: as SEBI publishes; the feed keeps only its latest 30 items
    historical_coverage: from this system's first read onwards (about three working days visible at a time)
    latency: feed time-to-live 60 minutes
    revision_policy: corrections arrive as new releases (for example a corrigendum); nothing is edited
    timestamp_semantics: publication_time
    reliability_rating: A
    authentication_method: none (public RSS; read at most once an hour - ADR-006)
    schema_description: one item per release - title, description (same as the title), link, pubDate (a date without a time of day)

  - source_id: fred_alfred
    provider: Federal Reserve Bank of St. Louis (FRED and its vintage archive ALFRED)
    source_class: official_statistics
    data_type: global and India macro context series - rates, currencies, commodities, world equity index closes, volatility, credit spreads, economic releases - with every vintage
    endpoint: https://api.stlouisfed.org/fred/ (series/observations and series only; JSON)
    authority: secondary
    license: FRED API terms - personal use, including series owned by others; owners' copyright notices kept; S&P Dow Jones Indices series refused (reproduction forbidden); stored privately and never redistributed; the owner's own key, never stored; notice 'This product uses the FRED API but is not endorsed or certified by the Federal Reserve Bank of St. Louis' (ADR-008)
    update_frequency: per series - daily, weekly releases of daily data, monthly or quarterly
    historical_coverage: per series from config/macro_series.yaml history_from (2016 daily, 2006 monthly); vintages from ALFRED
    latency: hours to weeks after the observation date, by publisher (H.15 next business day, H.10 and EIA weekly)
    revision_policy: a revised value is a new vintage with its real-time start; old vintages are kept; nothing is edited
    timestamp_semantics: publication_time
    reliability_rating: A
    authentication_method: API key of the owner, read from the environment variable FRED_API_KEY by the network module only; at most one request a second
    schema_description: observations - date, value ('.' when none), realtime_start, realtime_end; series - id, units, frequency, last_updated (with its UTC offset), notes

  - source_id: mospi_esankhyiki
    provider: Ministry of Statistics and Programme Implementation (MoSPI), National Statistics Office - eSankhyiki
    source_class: official_statistics
    data_type: India macro statistics - consumer prices (CPI), industrial production (IIP) and quarterly national accounts (GDP)
    endpoint: https://api.mospi.gov.in (/api/cpi/getCPIData, /api/iip/getIipData and /api/nas/getNASData only; JSON, paged)
    authority: primary
    license: MoSPI's own datasets are Category A under the Government Statistics Data Dissemination policy 2026 - reuse allowed with prominent attribution (Source - MoSPI, eSankhyiki); data from other ministries (WPI) and RBI tables are not used (ADR-009)
    update_frequency: monthly (CPI on the 12th, IIP on the 28th) and quarterly (GDP)
    historical_coverage: CPI base 2024 from 2025 and its back series 2013-2024 (recalculated); IIP base 2022-23 from 2023; GDP base 2022-23 from April 2022
    latency: about two weeks (CPI), four weeks (IIP) and two months (GDP) after the period
    revision_policy: no publication time and no provisional or final marks are given; a changed value read later is a new vintage from that read; a base-year change is a new series
    timestamp_semantics: publication_time
    reliability_rating: A
    authentication_method: none (public API; no key); requests spaced 3 seconds apart; the server needs TLS legacy renegotiation, allowed for this host only with certificate checks on (ADR-009)
    schema_description: data rows with base_year, series, year, month or financial-year quarter, the filter fields and the measures (index, inflation, growth_rate, constant_price, current_price); meta_data with page, totalRecords, totalPages, recordPerPage

  - source_id: market_calendars
    provider: exchange_calendars open-source library (Apache License 2.0), compiled from the exchanges' holiday notices
    source_class: licensed_vendor
    data_type: trading calendars - closed weekdays and weekend sessions of New York (XNYS), Tokyo (XTKS) and NSE/BSE (XBOM), 2006-2026
    endpoint: config/market_calendars.yaml, generated with exchange_calendars 4.13.2 (no network use by this system)
    authority: secondary
    license: Apache License 2.0 - licence text kept in docs/third_party/exchange_calendars-LICENSE.txt; holiday dates are facts from the exchanges' public notices
    update_frequency: yearly, when exchanges announce the next year's holidays (regenerate before coverage ends)
    historical_coverage: 2006-01-01 to 2026-12-31
    latency: as published by the library
    revision_policy: a corrected or extended calendar is a regenerated, reviewed file committed with its test changes
    timestamp_semantics: effective_date
    reliability_rating: B
    authentication_method: none (a file in the repository)
    schema_description: per calendar - id, name, time zone, coverage, closed weekdays, weekend sessions; series_calendars maps macro series to the calendar that decides their trading days

  - source_id: fed_monetary_feed
    provider: Board of Governors of the Federal Reserve System
    source_class: regulator_official
    data_type: Federal Reserve monetary-policy press releases - FOMC statements, minutes, projections; title, link and release time
    endpoint: https://www.federalreserve.gov/feeds/press_monetary.xml (RSS 2.0; nothing else on the site is read)
    authority: primary
    license: Federal Reserve Board website - information is in the public domain unless otherwise indicated and may be copied without permission; the Board is cited as the source; seals and logos never used (ADR-010)
    update_frequency: as the Board publishes; the feed keeps about its latest 15 items (about six months)
    historical_coverage: from this system's first read; items in the first read reach back about six months
    latency: none - FOMC statements are released at 2 pm New York time (18:00 or 19:00 UTC)
    revision_policy: corrections arrive as new releases; nothing is edited
    timestamp_semantics: publication_time
    reliability_rating: A
    authentication_method: none (public RSS; read at most once an hour; certificates checked)
    schema_description: one item per release - title, link, guid, description (same as the title), category, pubDate with time and zone (GMT)

  - source_id: ecb_press_feed
    provider: European Central Bank
    source_class: regulator_official
    data_type: ECB press releases, monetary policy decisions, speeches and interviews; title, link and release time
    endpoint: https://www.ecb.europa.eu/rss/press.html (RSS 2.0; nothing else on the site is read)
    authority: primary
    license: ECB website copyright notice - free use of information obtained directly from the site, reproduced accurately with the ECB cited as the source; modification stated explicitly; robots.txt crawl-delay 5 seconds respected (ADR-010)
    update_frequency: several items a day; the feed keeps its latest 15 items (about ten days)
    historical_coverage: from this system's first read (about ten days visible at a time)
    latency: none - monetary policy decisions are released at 14:15 Frankfurt time
    revision_policy: corrections arrive as new releases; nothing is edited
    timestamp_semantics: publication_time
    reliability_rating: A
    authentication_method: none (public RSS; read at most once an hour; certificates checked, with the public root Sectigo Public Server Authentication Root E46 added for this host only - ADR-010)
    schema_description: one item per release - title, link (document code such as ecb.mp for a monetary policy decision), guid, pubDate with time and zone (+0100 or +0200)

  - source_id: boj_whatsnew_feed
    provider: Bank of Japan
    source_class: regulator_official
    data_type: Bank of Japan what's-new feed in English - statements on monetary policy, minutes, operations and statistics; title, link and release time
    endpoint: https://www.boj.or.jp/en/rss/whatsnew.xml (RSS 2.0; nothing else on the site is read)
    authority: primary
    license: Bank of Japan site notice - content may be copied or reproduced with the Bank of Japan credited as the source, except for commercial purposes and images; this use is personal and non-commercial (ADR-010)
    update_frequency: several items a day; the feed keeps about its latest 47 items (about four weeks)
    historical_coverage: from this system's first read (about four weeks visible at a time)
    latency: none for the items it carries; on 18-Sep-2026 the main statement on monetary policy was not in the English feed, only its reference document
    revision_policy: corrections arrive as new releases; nothing is edited
    timestamp_semantics: publication_time
    reliability_rating: A
    authentication_method: none (public RSS; read at most once an hour; certificates checked)
    schema_description: one item per release - title, description (empty), link (http), guid, pubDate with time and zone (+0900)

  - source_id: fred_release_calendar
    provider: Federal Reserve Bank of St. Louis (FRED release calendar)
    source_class: official_statistics
    data_type: scheduled and past release dates of declared US releases - Consumer Price Index, Employment Situation, Gross Domestic Product
    endpoint: https://api.stlouisfed.org/fred/release/dates (JSON; release ids 10, 50 and 53 only)
    authority: secondary
    license: FRED API terms as for fred_alfred - personal use, stored privately and never redistributed; the owner's own key, never stored; notice 'This product uses the FRED API but is not endorsed or certified by the Federal Reserve Bank of St. Louis' (ADR-008, ADR-010)
    update_frequency: daily read; publishers change dates rarely (the US shutdown of late 2025 moved several)
    historical_coverage: the latest 40 dates per release, about two to three months of them in the future
    latency: dates are known months ahead; no time of day is given
    revision_policy: each read is a snapshot; a date added or dropped against the previous read is recorded as a schedule change; nothing is edited
    timestamp_semantics: effective_date
    reliability_rating: A
    authentication_method: API key of the owner, read from the environment variable FRED_API_KEY by the network module only; at most one request a second
    schema_description: realtime_start, realtime_end, order_by, sort_order, count, offset, limit and release_dates - a list of release_id and date (YYYY-MM-DD)

  - source_id: nse_fii_dii
    provider: National Stock Exchange of India (NSE)
    source_class: exchange_official
    data_type: daily FII/FPI and DII trading activity in the capital-market segment - buy, sell and net value in Rs crore, for NSE and for NSE, BSE and MSEI combined
    endpoint: https://www.nseindia.com/reports/fii-dii (two CSV files, fii-dii-nse-latest.csv and fii-dii-combined-latest.csv, downloaded by hand)
    authority: primary
    license: NSE Terms of Use - no automated collection; files downloaded by hand and stored privately for the owner's own research, never redistributed (ADR-004, ADR-011); NSDL and CDSL final FPI figures not used - their terms forbid storing them without written permission
    update_frequency: each trading day after the close; the page shows only the latest trading day
    historical_coverage: from the first file the owner downloads; a day not downloaded on the day cannot be recovered from the page (history only through NSE's research-data request)
    latency: same evening (provisional figures)
    revision_policy: NSE marks the figures provisional; the same day read again with other figures is a new vintage; final figures are on NSDL's and CDSL's sites (not used)
    timestamp_semantics: publication_time
    reliability_rating: B
    authentication_method: none (public page; hand download only - ADR-004)
    schema_description: header CATEGORY, DATE, BUY VALUE, SELL VALUE, NET VALUE (Rs Crores, split over two lines); two rows, DII and FII/FPI, for one trade date like 01-Oct-2026; amounts with thousands commas
