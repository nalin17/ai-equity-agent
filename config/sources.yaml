# Source Registry declarations (architecture Section 4, 40B step 2).
# Human-owned. Every source must be declared here before its data is used.
# These are declarations only - no data is downloaded yet.
# Excluded source classes (architecture 4F.2) are refused by the code:
#   private_tip_channel, unattributed_rumour, non_public_information

sources:
  - source_id: nse_bhavcopy_equity
    provider: NSE
    source_class: exchange_official
    data_type: daily equity prices (open, high, low, close, volume)
    endpoint: https://www.nseindia.com/all-reports (CM bhavcopy)
    authority: primary
    license: NSE website terms of use - check before redistribution
    update_frequency: daily, after market close
    historical_coverage: to be confirmed at ingestion (Stage 7)
    latency: same evening
    revision_policy: rarely revised; any revision is stored as a new version
    timestamp_semantics: publication_time
    reliability_rating: A
    authentication_method: none (public download)
    schema_description: one row per symbol and series per trading day

  - source_id: nse_corporate_actions
    provider: NSE
    source_class: exchange_official
    data_type: corporate actions (splits, bonuses, dividends, rights)
    endpoint: https://www.nseindia.com/companies-listing/corporate-filings-actions
    authority: primary
    license: NSE website terms of use - check before redistribution
    update_frequency: as announced
    historical_coverage: to be confirmed at ingestion
    latency: same day as announcement
    revision_policy: amendments published as new announcements
    timestamp_semantics: effective_date
    reliability_rating: A
    authentication_method: none (public download)
    schema_description: one row per action with symbol, type, ratio or amount, ex-date

  - source_id: nse_index_constituents
    provider: NSE Indices
    source_class: index_provider
    data_type: index membership (e.g. NIFTY 50, NIFTY 500)
    endpoint: https://www.niftyindices.com
    authority: primary
    license: NSE Indices terms of use - check before redistribution
    update_frequency: on index reconstitution (semi-annual plus ad hoc)
    historical_coverage: current list only; history must be rebuilt from change notices
    latency: announced ahead of effective date
    revision_policy: changes published as reconstitution notices
    timestamp_semantics: effective_date
    reliability_rating: A
    authentication_method: none (public download)
    schema_description: one row per index constituent with effective dates

  - source_id: nse_equity_list
    provider: NSE
    source_class: exchange_official
    data_type: list of securities available for trading in the equity segment (EQUITY_L.csv)
    endpoint: https://www.nseindia.com/market-data/securities-available-for-trading
    authority: primary
    license: NSE website terms of use - check before redistribution
    update_frequency: daily snapshot
    historical_coverage: current snapshot only - no history
    latency: same day
    revision_policy: replaced by NSE every day; each download is kept as its own raw file
    timestamp_semantics: snapshot_no_vintage
    reliability_rating: A
    authentication_method: none (manual browser download)
    schema_description: one row per listed security - symbol, company name, series, listing date, ISIN

  - source_id: nse_financial_results_index
    provider: NSE
    source_class: exchange_official
    data_type: listing of financial-results filings with XBRL links and exchange dissemination times
    endpoint: https://www.nseindia.com/companies-listing/corporate-filings-financial-results
    authority: primary
    license: NSE website terms of use - check before redistribution
    update_frequency: as companies file
    historical_coverage: chosen date range per download
    latency: minutes after filing
    revision_policy: re-filings appear as new rows with their own XBRL file and times
    timestamp_semantics: publication_time
    reliability_rating: A
    authentication_method: none (manual browser download)
    schema_description: one row per filing - company, audited, cumulative, basis, period, XBRL link, received and disseminated times

  - source_id: nse_financial_results_xbrl
    provider: NSE (company filings)
    source_class: company_filing
    data_type: quarterly and annual financial results in XBRL (non-financial Ind AS format)
    endpoint: https://nsearchives.nseindia.com/corporate/xbrl/
    authority: primary
    license: NSE website terms of use - check before redistribution
    update_frequency: quarterly per company
    historical_coverage: per filing
    latency: as filed by the company
    revision_policy: a re-filing is a new file; a changed value is a conflict until a correction is recorded
    timestamp_semantics: publication_time
    reliability_rating: A
    authentication_method: none (manual browser download)
    schema_description: XBRL instance - contexts, units and facts per filing; basis declared in the file
