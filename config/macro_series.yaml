    title: US Treasury 2-year yield (constant maturity)
    group: rates_and_bonds
    region: United States
    kind: published_statistic
    market: Federal Reserve Board, H.15 release (published the next business day)
    calendar: US business days; FRED lists a closed day with no value
    time_zone: America/New_York
    frequency: daily
    fred_units: Percent
    history_from: "2016-01-01"
    licence: US government data; FRED API terms
