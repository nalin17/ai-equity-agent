# Global and India macro context series (architecture 3G, 5C, 40B step 9a; ADR-008). Human-owned.
# Each series is context for Indian equities - never a covered security, a target or a benchmark
# (3G rule 2). It reaches a decision only as regime state or through a company's measured
# sensitivity to it (3G rule 3); a raw level is never a buy or sell signal on its own.
#
# Fields:
#   series_id      FRED's id. Checked against FRED's own description on every fetch.
#   group          the 3G group: rates_and_bonds, currencies, commodities, world_equity_markets,
#                  volatility_and_credit, economic_releases
#   kind           market_close        - a market's closing level on its session date. It cannot be
#                                        known before session_close (local time in time_zone).
#                                        Where the exact close is uncertain, the LATEST possible time
#                                        is declared: being late is safe, being early is look-ahead.
#                  published_statistic - a figure known only once its compiler publishes it.
#   market         the exchange that sets the value, or the publisher that compiles it
#   calendar       which days carry a value. FRED lists a day a market was closed with no value ('.').
#   time_zone      market closes: a zone declared in src/core/sessions.py
#   frequency      daily (business days), daily_7day, weekly, monthly or quarterly
#   fred_units     FRED's exact wording of the units - a change stops the fetch (4G rule 7)
#   history_from   the first observation date asked for on the first fetch
#   licence        the series owner's terms as FRED states them. Data is stored privately for the
#                  owner's own research and never published or distributed.
# Recorded series are never silently changed: editing or removing one stops fetch-macro.
# Not used: S&P 500 and the Dow Jones averages (SP500, DJIA ...) - S&P Dow Jones Indices forbids
# reproduction in any form without written permission, and SP500 has no vintages in ALFRED.

series:
  # ---- rates and bonds ----
