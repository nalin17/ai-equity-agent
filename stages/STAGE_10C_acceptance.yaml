  macro value used before this system or FRED proved it public: false
  revised value overwriting an earlier vintage: false
  value carried forward to a date without one: false
  empty or broken FRED answer stored as no data: false
  FRED key in the repository, database, files, logs or messages: false
  FRED address other than series and observations asked for: false
  S&P Dow Jones Indices series stored: false
  macro series used as a covered security, target or benchmark: false
