  historical replay of macro values older than this system's first read of them: false
  ALFRED vintage dates used as proof of availability: false
  India CPI, IIP, WPI, GDP, RBI policy rate or India VIX (Stage 10C-2, MoSPI and NSE): false
  Shanghai, Hang Seng, emerging-market equity index, GIFT Nifty, gold or steel-input prices: false
  revisions of values older than the look-back (45 days daily, 6 years monthly and quarterly) unless fetched with --full: false
  holiday calendars of foreign markets (absence follows FRED's own listing of a date without a value): false
  exact session close on early-close days (the regular close is declared - later than the truth, never earlier): false
  macro exposure features, measured company sensitivities or regime states (3G rule 3, 9C, 29): false
  US releases' consensus or surprise: false
negative_assertions:
