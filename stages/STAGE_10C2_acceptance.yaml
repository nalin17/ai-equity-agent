  WPI (its publisher's reuse terms are not published) and RBI tables: false
  CPI base 2012 series with its provisional and final marks: false
  India VIX and Nifty history (awaiting NSE's answer to the research-data request): false
  publication times of MoSPI releases (scheduled release calendar not used as proof): false
  calendars for Cboe, the US bond market, Shanghai or Hong Kong: false
  calendars beyond 2026-12-31 (show-macro warns 60 days before): false
