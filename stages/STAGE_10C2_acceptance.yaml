negative_assertions:
  value on a day its market was closed used as a close: false
  MoSPI value used before this system read it: false
  reconstructed back series presented as what was known at the time: false
  revised value overwriting an earlier vintage: false
  blank measure filled or stored as a value: false
  answer whose rows do not match the request stored: false
  MoSPI address other than the three data addresses asked for: false
  certificate checking switched off: false
  macro series used as a covered security, target or benchmark: false
